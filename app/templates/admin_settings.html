{% extends "base.html" %}
{% block body %}
<h1>Settings</h1>
<p class="small mute">Spec version now <b>{{ S.spec_version }}</b>. All money is in Rs.</p>
<form method="post" action="/admin/settings"><input type="hidden" name="csrf" value="{{ csrf }}">
{% for title,items in groups %}<div class="card"><h2>{{ title }}</h2><div class="grid g2">
  {% for k,label in items %}<div><label>{{ label }}</label><input name="{{ k }}" value="{{ S[k] }}"></div>{% endfor %}</div></div>{% endfor %}
<div class="stick"><button class="btn pri big">Save settings</button></div></form>
{% endblock %}
